name: Deploy RSS feeds

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 19 * * *"

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type check
        run: npm run check

      - name: Build feeds
        run: npm run build 2>&1 | tee build-output.log

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report failure as issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const LABEL = "ci-failure";

            let logTail = "";
            try {
              const log = fs.readFileSync("build-output.log", "utf8").trim();
              if (log) logTail = log.split("\n").slice(-40).join("\n").slice(-5000);
            } catch {}

            const detail = [
              `- 실행: [#${context.runNumber}](${runUrl})`,
              `- 트리거: \`${context.eventName}\``,
              `- ref: \`${context.ref}\``,
              `- 커밋: \`${context.sha.slice(0, 7)}\``,
              `- 시각(UTC): ${new Date().toISOString()}`,
            ].join("\n");

            const logBlock = logTail
              ? `\n\n**빌드 단계 로그 (마지막 부분):**\n\`\`\`\n${logTail}\n\`\`\``
              : "\n\n빌드 이전 단계(설치·테스트·타입체크·배포 등)에서 실패했습니다. 위 실행 링크의 로그를 확인하세요.";

            const hint = logTail.includes("returned 0 feed items")
              ? "\n\n> ⚠️ 한 소스가 0건을 반환했습니다. 블로그/홈페이지 구조 변경으로 스크래퍼가 깨졌을 가능성이 높습니다."
              : "";

            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: LABEL, per_page: 1,
            });

            if (existing.data.length > 0) {
              const number = existing.data[0].number;
              await github.rest.issues.createComment({
                owner, repo, issue_number: number,
                body: `### 🔁 또 실패했습니다\n${detail}${logBlock}${hint}`,
              });
              core.notice(`Commented on existing issue #${number}`);
            } else {
              const created = await github.rest.issues.create({
                owner, repo,
                title: "🚨 RSS 피드 빌드/배포 실패 (자동 등록)",
                labels: [LABEL],
                body: `RSS 피드 워크플로가 실패했습니다.\n\n${detail}${logBlock}${hint}\n\n---\n이 이슈는 워크플로 실패 시 자동 생성/갱신됩니다. 문제를 해결한 뒤 이슈를 닫아 주세요. 닫혀 있는 동안 다시 실패하면 새 이슈가 생성됩니다.`,
              });
              core.notice(`Created issue #${created.data.number}`);
            }
